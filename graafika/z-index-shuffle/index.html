<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Shuffle - Graphic Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⬆️ Z-Index Shuffle</h1>
        <p>Click boxes to bring them to the front layer!</p>
        <div class="shuffle-boxes">
            <div class="shuffle-box" style="background: linear-gradient(135deg, #FF6B6B, #FF8E72);">1</div>
            <div class="shuffle-box" style="background: linear-gradient(135deg, #4ECDC4, #44A08D);">2</div>
            <div class="shuffle-box" style="background: linear-gradient(135deg, #45B7D1, #2E86AB);">3</div>
            <div class="shuffle-box" style="background: linear-gradient(135deg, #FFA07A, #FF8C42);">4</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
