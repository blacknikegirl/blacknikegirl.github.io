<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Scaling - Graphic Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📜 Scroll-Driven Scaling</h1>
        <p>Scroll down - watch the elements grow or shrink!</p>
        
        <div class="scroll-content">
            <div class="scaling-box">1</div>
            <div class="scaling-box">2</div>
            <div class="scaling-box">3</div>
            <div class="scaling-box">4</div>
            <div class="scaling-box">5</div>
            <div class="scaling-box">6</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
