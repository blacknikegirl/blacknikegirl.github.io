<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragging Physics - Graphic Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Dragging Physics</h1>
        <p>Drag the boxes - they have inertia and will slide after you release!</p>
        <div class="boxes">
            <div class="draggable">1</div>
            <div class="draggable">2</div>
            <div class="draggable">3</div>
            <div class="draggable">4</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
