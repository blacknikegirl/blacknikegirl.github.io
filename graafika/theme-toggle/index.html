<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle - Graphic Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="toggle-btn" id="themeToggle">
            <div class="toggle-circle"></div>
        </div>
        <h1>🎨 Theme Toggle with Sound</h1>
        <p>Click the toggle button - it will switch themes with a sound effect!</p>
        <div class="content-box">
            <h2>Current Theme</h2>
            <p>Light/Dark mode with sound effects</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
