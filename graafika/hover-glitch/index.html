            <img class="glitch-img" src="data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect fill='%23FFA07A' width='200' height='200'/%3E%3C/svg%3E" alt="Image 4">
        </div>
