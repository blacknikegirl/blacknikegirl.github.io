<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🎮 PAC-MAN GAME</h1>
                <p class="subtitle">Classic Arcade Adventure</p>
            </div>
            <div class="stats-bar">
                <div class="stat-item">
                    <label>SCORE:</label>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <label>LIVES:</label>
                    <span id="lives" class="stat-value">3</span>
                </div>
            </div>
        </header>

        <div class="game-section">
            <div class="game-board-wrapper">
                <canvas id="gameCanvas" width="800" height="500"></canvas>
            </div>
        </div>

        <div class="game-controls">
            <button id="startButton" class="start-btn">▶ START GAME</button>
            <button id="pauseButton" class="pause-btn">⏸ PAUSE</button>
        </div>

        <div id="messageBox" class="message-box"></div>
        <div id="gameModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modalTitle">Game Over</h2>
                <p id="modalMessage">Final Score: 0</p>
                <button id="modalButton" class="modal-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
