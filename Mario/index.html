<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario platformer Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100vh;
            padding: 10px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 32px;
            margin: 5px 0;
        }

        #gameContainer {
            position: relative;
            width: 95vw;
            height: 85vh;
            border: 6px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 1600px;
            max-height: 1000px;
            outline: none;
            background: #87CEEB;
        }

        #gameBackground {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            z-index: 0;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 70%, #228B22 85%, #1a6b1a 100%);
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .hill {
            position: absolute;
            background: #228B22;
            border-radius: 100% 100% 0 0;
            bottom: 0;
        }

        #gameWorld {
            position: absolute;
            width: 4000px;
            height: 100%;
            left: 0;
            top: 0;
            z-index: 1;
        }

        #gameWorld {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        .mario {
            position: absolute;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .platform {
            position: absolute;
            background: linear-gradient(180deg, #228B22 0%, #228B22 25%, #8B4513 25%, #654321 100%);
            border: 2px solid #4a2511;
            font-size: 12px;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.3);
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 40%, #9d5e2b 40%, #9d5e2b 60%),
                repeating-linear-gradient(0deg, transparent, transparent 25%, rgba(0,0,0,0.1) 25%, rgba(0,0,0,0.1) 50%),
                linear-gradient(180deg, #228B22 0%, #228B22 25%, #8B4513 25%, #654321 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            background-position: 0 0, 0 0, 0 0;
        }

        .platform::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 25%;
            background: repeating-linear-gradient(90deg, #22aa22 0px, #22aa22 2px, #228B22 2px, #228B22 4px);
            border-bottom: 1px solid #1a6b1a;
        }

        .protrusion {
            position: absolute;
            background: linear-gradient(180deg, #228B22 0%, #228B22 35%, #8B4513 35%, #654321 100%);
            border: 3px solid #3a1a00;
            border-top: 2px solid #4a3a20;
            box-shadow: 
                inset 0 3px 0 rgba(255,255,255,0.4), 
                inset 0 -3px 0 rgba(0,0,0,0.4),
                inset 3px 0 0 rgba(255,255,255,0.2),
                inset -3px 0 0 rgba(0,0,0,0.2),
                4px 4px 8px rgba(0,0,0,0.3);
        }

        .protrusion::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 38%;
            background: repeating-linear-gradient(90deg, #22aa22 0px, #22aa22 3px, #228B22 3px, #228B22 6px);
            border-bottom: 2px solid #1a5a1a;
        }

        .protrusion::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            pointer-events: none;
        }

        .enemy {
            position: absolute;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .coin {
            position: absolute;
            background: #FFD700;
            border: 2px solid #FFA500;
            border-radius: 50%;
            animation: coin-spin 0.5s infinite;
        }

        @keyframes coin-spin {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.3); }
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-size: 18px;
            z-index: 100;
            pointer-events: none;
        }

        .ui-item {
            margin: 8px 0;
        }

        .controls {
            color: white;
            text-align: center;
            font-size: 12px;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 6px;
            max-width: 400px;
        }

        .controls-list {
            background: transparent;
            padding: 8px 0;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 11px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            display: none;
            font-size: 48px;
            min-width: 300px;
        }

        .game-over button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .game-over button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍄 SUPER MARIO 🍄</h1>

        <div id="gameContainer">
            <div id="gameBackground">
                <!-- Clouds -->
                <div class="cloud" style="width: 120px; height: 50px; left: 150px; top: 80px;"></div>
                <div class="cloud" style="width: 100px; height: 45px; left: 550px; top: 120px;"></div>
                <div class="cloud" style="width: 130px; height: 55px; left: 950px; top: 70px;"></div>
                <div class="cloud" style="width: 110px; height: 48px; left: 1350px; top: 100px;"></div>
                <div class="cloud" style="width: 120px; height: 50px; left: 1750px; top: 80px;"></div>
                <div class="cloud" style="width: 100px; height: 45px; left: 2150px; top: 130px;"></div>
                <div class="cloud" style="width: 125px; height: 52px; left: 2550px; top: 90px;"></div>
                <div class="cloud" style="width: 105px; height: 47px; left: 2950px; top: 110px;"></div>
                <div class="cloud" style="width: 115px; height: 49px; left: 3350px; top: 85px;"></div>
                <!-- Hills -->
                <div class="hill" style="width: 300px; height: 120px; left: 200px; bottom: 0;"></div>
                <div class="hill" style="width: 250px; height: 100px; left: 600px; bottom: 0;"></div>
                <div class="hill" style="width: 280px; height: 110px; left: 1000px; bottom: 0;"></div>
                <div class="hill" style="width: 270px; height: 105px; left: 1400px; bottom: 0;"></div>
                <div class="hill" style="width: 290px; height: 115px; left: 1800px; bottom: 0;"></div>
                <div class="hill" style="width: 260px; height: 100px; left: 2200px; bottom: 0;"></div>
                <div class="hill" style="width: 310px; height: 120px; left: 2600px; bottom: 0;"></div>
                <div class="hill" style="width: 280px; height: 110px; left: 3000px; bottom: 0;"></div>
                <div class="hill" style="width: 300px; height: 115px; left: 3400px; bottom: 0;"></div>
            </div>
            <div id="gameWorld"></div>
            <div id="ui">
                <div class="ui-item">Score: <span id="score">0</span></div>
                <div class="ui-item">Coins: <span id="coins">0</span></div>
                <div class="ui-item">Lives: <span id="lives">3</span></div>
            </div>
            <div class="game-over" id="gameOver">
                <div>GAME OVER!</div>
                <div id="gameOverText"></div>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>

        <div class="controls">
            <div><strong>⌨️ Controls:</strong></div>
            <div class="controls-list">
                <div>A/D: Move Left/Right</div>
                <div>W / SPACE: Jump</div>
                <div>S: Drop Down/Get Off Platform</div>
                <div style="margin-top: 5px; opacity: 0.7;">📁 Place Mario.png and mushroom.png in the same folder</div>
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const gameWorld = document.getElementById('gameWorld');
        const scoreDisplay = document.getElementById('score');
        const coinsDisplay = document.getElementById('coins');
        const livesDisplay = document.getElementById('lives');
        const gameOverScreen = document.getElementById('gameOver');
        const gameOverText = document.getElementById('gameOverText');

        // Game variables
        let score = 0;
        let coinsCollected = 0;
        let lives = 3;
        let gameActive = true;

        // Calculate scale based on container size - wait for container to load
        let GAME_SCALE = 1;
        
        function calculateScale() {
            const containerWidth = gameContainer.offsetWidth || 1600;
            const containerHeight = gameContainer.offsetHeight || 1000;
            GAME_SCALE = Math.min(
                containerWidth / 800,
                containerHeight / 600
            );
            return GAME_SCALE;
        }
        
        calculateScale();

        // Camera system for scrolling world
        const camera = {
            x: 0,
            updatePosition(marioX, containerWidth, worldWidth) {
                // Keep Mario in left-center of screen
                const targetX = marioX - containerWidth / 4;
                this.x = Math.max(0, Math.min(targetX, worldWidth - containerWidth));
            }
        };

        // Mario object with scaled dimensions
        const mario = {
            x: 50 * GAME_SCALE,
            y: (520 - 90) * GAME_SCALE,  // Spawn above ground platform
            width: 80 * GAME_SCALE,
            height: 80 * GAME_SCALE,
            velocityY: 0,
            velocityX: 0,
            jumping: false,
            speed: 5 * GAME_SCALE,
            jumpPower: 15,
            gravity: 0.6,
            maxGravity: 15
        };

        // Input handling - More robust
        const keys = {};
        
        function setupInputHandling() {
            // Listen on document for all key events
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                keys[key] = true;
                console.log('Key pressed:', key);
                // Prevent default for space to avoid scrolling
                if (key === ' ') {
                    e.preventDefault();
                }
            });
            
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                keys[key] = false;
                console.log('Key released:', key);
            });
        }
        
        setupInputHandling();

        // Make game container focusable for keyboard input
        gameContainer.setAttribute('tabindex', '0');
        gameContainer.addEventListener('click', () => {
            gameContainer.focus();
        });
        
        // Click anywhere to focus the game
        document.addEventListener('click', () => {
            gameContainer.focus();
        });
        
        // Auto-focus game after a short delay
        setTimeout(() => {
            gameContainer.focus();
        }, 500);

        // Platform class
        class Platform {
            constructor(x, y, width, height) {
                this.x = x * GAME_SCALE;
                this.y = y * GAME_SCALE;
                this.width = width * GAME_SCALE;
                this.height = height * GAME_SCALE;
                this.element = document.createElement('div');
                this.element.className = 'platform';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.width + 'px';
                this.element.style.height = this.height + 'px';
                gameWorld.appendChild(this.element);
            }

            collidesWith(obj) {
                return obj.x < this.x + this.width &&
                       obj.x + obj.width > this.x &&
                       obj.y < this.y + this.height &&
                       obj.y + obj.height > this.y;
            }
        }

        // Enemy class
        class Enemy {
            constructor(x, y) {
                this.x = x * GAME_SCALE;
                this.y = y * GAME_SCALE;
                this.width = 64 * GAME_SCALE;
                this.height = 64 * GAME_SCALE;
                this.speed = 2 * GAME_SCALE;
                this.direction = 1;
                this.velocityY = 0;
                this.velocityX = 0;
                this.gravity = 0.6;
                this.maxGravity = 15;
                this.element = document.createElement('img');
                this.element.className = 'enemy';
                this.element.src = 'mushroom.png';
                this.element.alt = 'Enemy Mushroom';
                this.element.style.width = this.width + 'px';
                this.element.style.height = this.height + 'px';
                // Fallback if image doesn't load
                this.element.onerror = () => {
                    this.element.style.background = 'green';
                    this.element.style.border = '3px solid #006600';
                    this.element.textContent = '👾';
                    this.element.style.display = 'flex';
                    this.element.style.alignItems = 'center';
                    this.element.style.justifyContent = 'center';
                    this.element.style.fontSize = (40 * GAME_SCALE) + 'px';
                    this.element.style.color = 'white';
                };
                gameWorld.appendChild(this.element);
            }

            update() {
                // Horizontal movement
                this.velocityX = this.speed * this.direction;
                this.x += this.velocityX;
                
                // Apply gravity
                this.velocityY += this.gravity;
                if (this.velocityY > this.maxGravity) {
                    this.velocityY = this.maxGravity;
                }
                this.y += this.velocityY;

                // Boundary checking (sides) - change direction at world edges
                if (this.x < 0 || this.x > 4000 - this.width) {
                    this.direction *= -1;
                }

                // Ground collision
                const groundLevel = 520 * GAME_SCALE;
                if (this.y + this.height > groundLevel) {
                    this.y = groundLevel - this.height;
                    this.velocityY = 0;
                }

                // Platform collision (including protrusions) - precise hitbox matching
                platforms.forEach(platform => {
                    // Check if enemy is above platform and falling
                    if (this.velocityY >= 0 &&
                        this.y + this.height <= platform.y + 5 &&
                        this.y + this.height + this.velocityY + 2 >= platform.y &&
                        this.x + this.width > platform.x &&
                        this.x < platform.x + platform.width) {
                        this.y = platform.y - this.height;
                        this.velocityY = 0;
                    }
                    // Check if hitting protrusions horizontally and bounce back
                    if (platform.y === 490 * GAME_SCALE) {
                        if (this.x + this.width > platform.x && 
                            this.x < platform.x + platform.width &&
                            this.y + this.height > platform.y &&
                            this.y <= platform.y) {
                            // Bounce off
                            this.direction *= -1;
                        }
                    }
                });

                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
            }

            collidesWith(obj) {
                return obj.x < this.x + this.width &&
                       obj.x + obj.width > this.x &&
                       obj.y < this.y + this.height &&
                       obj.y + obj.height > this.y;
            }
        }

        // Coin class
        class Coin {
            constructor(x, y) {
                this.x = x * GAME_SCALE;
                this.y = y * GAME_SCALE;
                this.width = 24 * GAME_SCALE;
                this.height = 24 * GAME_SCALE;
                this.element = document.createElement('div');
                this.element.className = 'coin';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.width + 'px';
                this.element.style.height = this.height + 'px';
                gameWorld.appendChild(this.element);
                this.collected = false;
            }

            collidesWith(obj) {
                return obj.x < this.x + this.width &&
                       obj.x + obj.width > this.x &&
                       obj.y < this.y + this.height &&
                       obj.y + obj.height > this.y;
            }
        }

        // Create level
        const platforms = [];
        const protrusions = [];
        const enemies = [];
        const coins = [];

        function createLevel() {
            // Ground platform (expanded)
            platforms.push(new Platform(0, 520, 4000, 80));

            // First section - platforms sized for character hitboxes
            platforms.push(new Platform(250, 320, 80, 20));
            platforms.push(new Platform(550, 280, 80, 20));

            // Second section
            platforms.push(new Platform(950, 320, 80, 20));
            platforms.push(new Platform(1300, 280, 80, 20));

            // Third section - staircase reduced
            platforms.push(new Platform(1700, 300, 80, 20));
            platforms.push(new Platform(2000, 250, 80, 20));

            // Fourth section - reduced
            platforms.push(new Platform(2400, 300, 80, 20));
            platforms.push(new Platform(2750, 250, 80, 20));

            // Fifth section - final approach
            platforms.push(new Platform(3100, 280, 80, 20));
            platforms.push(new Platform(3450, 240, 80, 20));

            // Ground protrusions (tangible blocks - added to platforms for collision)
            platforms.push(new Platform(600, 490, 60, 30));
            platforms.push(new Platform(1350, 490, 60, 30));
            platforms.push(new Platform(2100, 490, 60, 30));
            platforms.push(new Platform(2850, 490, 60, 30));

            // Enemies positioned on ground between protrusions
            enemies.push(new Enemy(975, 440));
            enemies.push(new Enemy(1750, 440));
            enemies.push(new Enemy(2500, 440));
            enemies.push(new Enemy(3200, 440));

            // Coins
            coins.push(new Coin(600, 450));
            coins.push(new Coin(1350, 450));
            coins.push(new Coin(2100, 450));
            coins.push(new Coin(2850, 450));
            coins.push(new Coin(150, 380));
            coins.push(new Coin(750, 360));
            coins.push(new Coin(1500, 380));
            coins.push(new Coin(2250, 360));
            coins.push(new Coin(3000, 380));

            // Create ground protrusions
            const GAME_SCALE_VAL = GAME_SCALE;
            function drawProtrusion(x, y, width, height) {
                const protrusion = document.createElement('div');
                protrusion.className = 'protrusion';
                protrusion.style.left = (x * GAME_SCALE_VAL) + 'px';
                protrusion.style.top = (y * GAME_SCALE_VAL) + 'px';
                protrusion.style.width = (width * GAME_SCALE_VAL) + 'px';
                protrusion.style.height = (height * GAME_SCALE_VAL) + 'px';
                gameWorld.appendChild(protrusion);
            }

            // Draw visual protrusions on ground (only at ground level)
            drawProtrusion(600, 490, 60, 30);
            drawProtrusion(1350, 490, 60, 30);
            drawProtrusion(2100, 490, 60, 30);
            drawProtrusion(2850, 490, 60, 30);
        }

        // Create Mario visual
        const marioElement = document.createElement('img');
        marioElement.className = 'mario';
        marioElement.src = 'Mario.png';
        marioElement.alt = 'Mario';
        marioElement.style.width = mario.width + 'px';
        marioElement.style.height = mario.height + 'px';
        // Fallback if image doesn't load
        marioElement.onerror = function() {
            marioElement.style.background = 'red';
            marioElement.style.border = '3px solid #cc0000';
            marioElement.textContent = '🔴';
            marioElement.style.display = 'flex';
            marioElement.style.alignItems = 'center';
            marioElement.style.justifyContent = 'center';
            marioElement.style.fontSize = (50 * GAME_SCALE) + 'px';
        };
        gameWorld.appendChild(marioElement);

        // Physics and collision
        function update() {
            if (!gameActive) return;

            // Mario movement - A/D keys left/right, W/SPACE to jump, S to drop
            if (keys['a']) {
                mario.velocityX = -mario.speed;
            } else if (keys['d']) {
                mario.velocityX = mario.speed;
            } else {
                mario.velocityX = 0;
            }

            // Jumping - W or SPACE key
            if ((keys['w'] || keys[' ']) && !mario.jumping) {
                mario.velocityY = -mario.jumpPower;
                mario.jumping = true;
            }

            // Drop off platform - S key
            if (keys['s'] && !mario.jumping) {
                mario.velocityY = 2; // Start falling
                mario.jumping = true;
            }

            // Apply gravity
            mario.velocityY += mario.gravity;
            if (mario.velocityY > mario.maxGravity) {
                mario.velocityY = mario.maxGravity;
            }

            // Update position
            mario.x += mario.velocityX;
            mario.y += mario.velocityY;

            // Boundary checking (sides)
            if (mario.x < 0) mario.x = 0;
            const worldWidth = 4000; // Expanded world width
            if (mario.x + mario.width > worldWidth) {
                mario.x = worldWidth - mario.width;
            }

            // Boundary checking (prevent falling underground)
            const groundLevel = 520 * GAME_SCALE; // Match ground platform Y position
            if (mario.y + mario.height > groundLevel + 80 * GAME_SCALE) {
                mario.y = groundLevel + 80 * GAME_SCALE - mario.height;
                mario.velocityY = 0;
            }

            // Platform collision (skip if pressing S to drop down)
            let onGround = false;
            if (!keys['s']) {  // Only check collision if NOT pressing S
                platforms.forEach(platform => {
                    // Check if Mario is above platform and falling or touching - precise hitbox matching
                    if (mario.velocityY >= 0 &&
                        mario.y + mario.height <= platform.y + 5 &&
                        mario.y + mario.height + mario.velocityY + 2 >= platform.y &&
                        mario.x + mario.width > platform.x &&
                        mario.x < platform.x + platform.width) {
                        mario.y = platform.y - mario.height;
                        mario.velocityY = 0;
                        mario.jumping = false;
                        onGround = true;
                    }
                });
            }

            // Game over if fall off screen
            if (mario.y > gameContainer.offsetHeight) {
                loseLife();
            }

            // Enemy update and collision
            const enemiesToRemove = [];
            enemies.forEach((enemy, index) => {
                enemy.update();
                
                // Check if Mario is jumping on enemy from above - precise hitbox matching
                if (mario.velocityY > 0 &&
                    mario.y + mario.height <= enemy.y + 10 &&
                    mario.x + mario.width > enemy.x &&
                    mario.x < enemy.x + enemy.width) {
                    // Enemy defeated!
                    enemy.element.remove();
                    enemiesToRemove.push(index);
                    mario.velocityY = -mario.jumpPower * 0.7; // Bounce effect
                    mario.jumping = true;
                    score += 200;
                    scoreDisplay.textContent = score;
                } else if (enemy.collidesWith(mario)) {
                    // Hit from side or top - lose life
                    loseLife();
                }
            });
            
            // Remove defeated enemies
            for (let i = enemiesToRemove.length - 1; i >= 0; i--) {
                enemies.splice(enemiesToRemove[i], 1);
            }

            // Coin collection
            coins.forEach(coin => {
                if (!coin.collected && coin.collidesWith(mario)) {
                    coin.collected = true;
                    coin.element.remove();
                    coinsCollected++;
                    score += 100;
                    coinsDisplay.textContent = coinsCollected;
                    scoreDisplay.textContent = score;
                }
            });

            // Update camera
            camera.updatePosition(mario.x, gameContainer.offsetWidth, worldWidth);
            gameWorld.style.transform = `translateX(-${camera.x}px)`;

            // Update Mario display
            marioElement.style.left = mario.x + 'px';
            marioElement.style.top = mario.y + 'px';

            requestAnimationFrame(update);
        }

        function loseLife() {
            lives--;
            livesDisplay.textContent = lives;

            if (lives <= 0) {
                endGame();
            } else {
                // Reset Mario position - spawn above ground
                mario.x = 50 * GAME_SCALE;
                mario.y = (520 - 90) * GAME_SCALE;
                mario.velocityY = 0;
                mario.velocityX = 0;
                mario.jumping = false;
            }
        }

        function endGame() {
            gameActive = false;
            gameOverScreen.style.display = 'block';
            gameOverText.textContent = `Final Score: ${score} | Coins: ${coinsCollected}`;
        }

        // Initialize
        createLevel();
        update();
    </script>
</body>
</html>
