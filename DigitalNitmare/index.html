<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Digital Nightmare</title>
	<style>
		:root {
			--primary: #00ff88;
			--secondary: #ff0055;
			--tertiary: #00ccff;
			--bg-dark: #0a0e27;
			--bg-darker: #050812;
			--text-main: #ffffff;
			--text-muted: #888899;
			--border: rgba(0, 255, 136, 0.2);
			--border-hover: rgba(0, 255, 136, 0.4);
			--radius: 8px;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Monaco', 'Courier New', monospace;
			background: linear-gradient(135deg, var(--bg-darker) 0%, #1a0f3d 50%, var(--bg-dark) 100%);
			color: var(--text-main);
			min-height: 100vh;
			overflow: hidden;
		}

		.container {
			display: flex;
			height: 100vh;
			gap: 16px;
			padding: 16px;
			background: 
				radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.08), transparent 30%),
				radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.08), transparent 30%);
		}

		.stage {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--bg-darker);
			border: 2px solid var(--border);
			border-radius: var(--radius);
			position: relative;
			overflow: hidden;
			box-shadow: 
				0 0 40px rgba(0, 255, 136, 0.1),
				inset 0 0 30px rgba(0, 0, 0, 0.5);
		}

		#view {
			width: 100%;
			height: 100%;
			max-height: 100%;
			max-width: 100%;
			object-fit: contain;
			cursor: crosshair;
			display: block;
		}

		.stage::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(0,255,136,0.03)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
			pointer-events: none;
			z-index: 1;
		}

		.panel {
			width: 380px;
			background: var(--bg-dark);
			border: 2px solid var(--border);
			border-radius: var(--radius);
			padding: 20px;
			overflow-y: auto;
			box-shadow: 
				0 0 40px rgba(0, 255, 136, 0.05),
				inset 0 0 20px rgba(0, 0, 0, 0.3);
		}

		.panel::-webkit-scrollbar {
			width: 8px;
		}

		.panel::-webkit-scrollbar-track {
			background: rgba(0, 255, 136, 0.05);
		}

		.panel::-webkit-scrollbar-thumb {
			background: var(--primary);
			border-radius: 4px;
		}

		.panel::-webkit-scrollbar-thumb:hover {
			background: var(--secondary);
		}

		.header {
			margin-bottom: 24px;
		}

		.header h1 {
			font-size: 24px;
			font-weight: bold;
			letter-spacing: 2px;
			margin-bottom: 6px;
			background: linear-gradient(90deg, var(--primary), var(--tertiary));
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		.header p {
			font-size: 12px;
			color: var(--text-muted);
			line-height: 1.4;
		}

		.section {
			margin-bottom: 18px;
		}

		.section-title {
			font-size: 11px;
			font-weight: bold;
			letter-spacing: 1px;
			color: var(--primary);
			text-transform: uppercase;
			margin-bottom: 12px;
			padding: 8px;
			border-left: 3px solid var(--primary);
			background: rgba(0, 255, 136, 0.05);
		}

		.control-group {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		label {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 12px;
			cursor: pointer;
			padding: 8px;
			border-radius: 4px;
			transition: background 0.2s, border-color 0.2s;
			border: 1px solid transparent;
		}

		label:hover {
			background: rgba(0, 255, 136, 0.08);
			border-color: var(--border-hover);
		}

		input[type="checkbox"] {
			width: 16px;
			height: 16px;
			cursor: pointer;
			accent-color: var(--primary);
		}

		input[type="range"] {
			width: 100%;
			height: 6px;
			background: rgba(0, 255, 136, 0.1);
			border-radius: 3px;
			outline: none;
			-webkit-appearance: none;
			appearance: none;
		}

		input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			width: 14px;
			height: 14px;
			background: var(--primary);
			border-radius: 50%;
			cursor: pointer;
			box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
		}

		input[type="range"]::-moz-range-thumb {
			width: 14px;
			height: 14px;
			background: var(--primary);
			border-radius: 50%;
			cursor: pointer;
			border: none;
			box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
		}

		select {
			width: 100%;
			padding: 8px;
			background: var(--bg-darker);
			color: var(--text-main);
			border: 1px solid var(--border);
			border-radius: 4px;
			font-family: 'Monaco', monospace;
			font-size: 12px;
			cursor: pointer;
			transition: border-color 0.2s;
		}

		select:hover {
			border-color: var(--border-hover);
		}

		input[type="file"] {
			display: none;
		}

		button {
			padding: 10px;
			background: var(--bg-darker);
			color: var(--primary);
			border: 1px solid var(--primary);
			border-radius: 4px;
			font-family: 'Monaco', monospace;
			font-size: 12px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.2s;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		button:hover {
			background: var(--primary);
			color: var(--bg-dark);
			box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
			transform: translateY(-2px);
		}

		button.danger {
			color: var(--secondary);
			border-color: var(--secondary);
		}

		button.danger:hover {
			background: var(--secondary);
			color: white;
			box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
		}

		.btn-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}

		.file-label {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 10px;
			background: var(--bg-darker);
			color: var(--primary);
			border: 1px solid var(--primary);
			border-radius: 4px;
			font-size: 12px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.2s;
			text-transform: uppercase;
			letter-spacing: 1px;
			width: 100%;
		}

		.file-label:hover {
			background: var(--primary);
			color: var(--bg-dark);
			box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
		}

		#status {
			font-size: 11px;
			color: var(--text-muted);
			padding: 12px;
			background: rgba(0, 255, 136, 0.05);
			border: 1px solid var(--border);
			border-radius: 4px;
			min-height: 40px;
			line-height: 1.5;
			margin-top: 16px;
		}

		/* ==================== EFFECTS DESIGN ====================  */
		.effects-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}

		.effect-toggle {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px;
			background: rgba(0, 255, 136, 0.05);
			border: 2px solid var(--border);
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.2s;
			font-size: 11px;
			font-weight: bold;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.effect-toggle:hover {
			background: rgba(0, 255, 136, 0.1);
			border-color: var(--primary);
			transform: translateY(-1px);
		}

		.effect-toggle input[type="checkbox"] {
			width: 14px;
			height: 14px;
			margin-left: 8px;
			cursor: pointer;
			flex-shrink: 0;
		}

		.effect-toggle input[type="checkbox"]:checked {
			box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
		}

		.effect-toggle.active {
			background: rgba(0, 255, 136, 0.15);
			border-color: var(--primary);
			box-shadow: 0 0 15px rgba(0, 255, 136, 0.2), inset 0 0 10px rgba(0, 255, 136, 0.1);
			color: var(--primary);
		}

		.effect-label {
			flex: 1;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.effect-icon {
			font-size: 12px;
			opacity: 0.6;
		}

		.effect-toggle.active .effect-icon {
			opacity: 1;
			filter: drop-shadow(0 0 4px rgba(0, 255, 136, 0.6));
		}

		.effect-card {
			background: rgba(0, 255, 136, 0.05);
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 12px;
			margin-bottom: 10px;
			transition: all 0.2s;
		}

		.effect-card:hover {
			background: rgba(0, 255, 136, 0.08);
			border-color: var(--border-hover);
		}

		.effect-card-title {
			font-size: 10px;
			font-weight: bold;
			color: var(--primary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			gap: 4px;
		}

		.effect-card-title::before {
			content: '⚡';
			font-size: 10px;
		}

		.effect-slider-container {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.effect-slider-label {
			font-size: 11px;
			font-weight: bold;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.effect-slider-value {
			font-size: 10px;
			color: var(--primary);
			font-weight: bold;
		}

		/* Button enhancements */
		button {
			transition: all 0.3s ease;
		}

		button:hover:not(:active) {
			transform: translateY(-2px);
		}

		button:active {
			transform: translateY(0);
		}

		/* Slider enhancements */
		input[type="range"] {
			transition: all 0.2s;
		}

		input[type="range"]::-webkit-slider-thumb {
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
			transition: all 0.2s;
		}

		input[type="range"]::-webkit-slider-thumb:hover {
			box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
			transform: scale(1.2);
		}

		input[type="range"]::-moz-range-thumb {
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
			transition: all 0.2s;
		}

		input[type="range"]::-moz-range-thumb:hover {
			box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
			transform: scale(1.2);
		}

		video, img {
			display: none !important;
		}

		@media (max-width: 1024px) {
			.container {
				flex-direction: column;
			}

			.panel {
				width: 100%;
				max-height: 40vh;
			}

			.stage {
				flex: 1;
				min-height: 55vh;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<main class="stage">
			<canvas id="view" width="960" height="540"></canvas>
			<video id="camera" playsinline muted></video>
			<img id="photo" alt="upload source" />
		</main>

		<aside class="panel">
			<div class="header">
				<h1>DIGITAL<br>NIGHTMARE</h1>
				<p>Upload image or enable camera. Move mouse &amp; click for chaos.</p>
			</div>

			<div class="section">
				<div class="section-title">░ Input Source</div>
				<div class="control-group">
					<label class="file-label">
						📁 Upload Image
						<input id="upload" type="file" accept="image/*" />
					</label>
					<div class="btn-row">
						<button id="cameraBtn">📷 Camera</button>
						<button id="stopCameraBtn" class="danger">⏹ Stop</button>
					</div>
				</div>
			</div>

			<div class="section">
				<div class="section-title">░ Glitch Effects</div>
				<div class="effect-card">
					<div class="effect-card-title">Color Distortions</div>
					<div class="effects-grid">
						<label class="effect-toggle" id="rgbSplitToggle">
							<div class="effect-label">
								<span class="effect-icon">🌈</span>
								<span>RGB Split</span>
							</div>
							<input id="rgbSplit" type="checkbox" checked />
						</label>
						<label class="effect-toggle" id="datamoshToggle">
							<div class="effect-label">
								<span class="effect-icon">🎬</span>
								<span>Datamosh</span>
							</div>
							<input id="datamosh" type="checkbox" checked />
						</label>
					</div>
				</div>
				<div class="effect-card">
					<div class="effect-card-title">Pixel Effects</div>
					<div class="effects-grid">
						<label class="effect-toggle" id="pixelSortToggle">
							<div class="effect-label">
								<span class="effect-icon">⬚</span>
								<span>Pixel Sort</span>
							</div>
							<input id="pixelSort" type="checkbox" checked />
						</label>
						<label class="effect-toggle" id="audioReactiveToggle">
							<div class="effect-label">
								<span class="effect-icon">🔊</span>
								<span>Audio React</span>
							</div>
							<input id="audioReactive" type="checkbox" />
						</label>
					</div>
				</div>
				<button id="micBtn" style="width: 100%; padding: 10px; background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(255, 0, 85, 0.2)); border: 2px solid var(--primary); color: var(--primary); font-weight: bold; cursor: pointer; border-radius: 6px; transition: all 0.2s; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">🎤 Enable Microphone</button>
			</div>

			<div class="section">
				<div class="section-title">░ Overlays &amp; Effects</div>
				<div class="effect-card">
					<div class="effect-card-title">Visual Layers</div>
					<div class="effects-grid">
						<label class="effect-toggle" id="scanlinesToggle">
							<div class="effect-label">
								<span class="effect-icon">📺</span>
								<span>Scanlines</span>
							</div>
							<input id="scanlines" type="checkbox" checked />
						</label>
						<label class="effect-toggle" id="vhsToggle">
							<div class="effect-label">
								<span class="effect-icon">📼</span>
								<span>VHS Noise</span>
							</div>
							<input id="vhs" type="checkbox" checked />
						</label>
					</div>
				</div>
				<div class="effect-card">
					<div class="effect-card-title">Transform Effects</div>
					<label class="effect-toggle" style="margin-bottom: 8px;" id="mirrorToggle">
						<div class="effect-label">
							<span class="effect-icon">🪞</span>
							<span>Mirror Dimension</span>
						</div>
						<input id="mirrorEnabled" type="checkbox" />
					</label>
					<div class="effect-slider-container">
						<label class="effect-slider-label">Mirror Sectors</label>
						<select id="mirrorSectors" style="padding: 8px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--border); color: var(--primary); border-radius: 4px; font-weight: bold; cursor: pointer;">
							<option value="4">4 Sectors</option>
							<option value="8">8 Sectors</option>
						</select>
					</div>
				</div>
			</div>

			<div class="section">
				<div class="section-title">░ Advanced Settings</div>
				<div class="effect-card">
					<div class="effect-card-title">Processing Modes</div>
					<div class="effects-grid">
						<label class="effect-toggle" id="freezeToggle">
							<div class="effect-label">
								<span class="effect-icon">❄️</span>
								<span>Frame Freeze</span>
							</div>
							<input id="freezeEnabled" type="checkbox" checked />
						</label>
						<label class="effect-toggle" id="asciiToggle">
							<div class="effect-label">
								<span class="effect-icon">📝</span>
								<span>ASCII Mode</span>
							</div>
							<input id="asciiMode" type="checkbox" />
						</label>
					</div>
				</div>
				<div class="effect-card">
					<div class="effect-card-title">Intensity Control</div>
					<div class="effect-slider-container">
						<div style="display: flex; justify-content: space-between; align-items: center;">
							<label class="effect-slider-label">Chaos Level</label>
							<span class="effect-slider-value" id="chaosValue">1.2</span>
						</div>
						<input id="chaosLevel" type="range" min="0.1" max="2.5" value="1.2" step="0.1" style="width: 100%; accent-color: var(--primary); cursor: pointer;" />
						<div style="font-size: 9px; color: var(--text-muted); text-align: right; margin-top: 4px;">Min: 0.1 &nbsp; Max: 2.5</div>
					</div>
				</div>
				<button id="saveBtn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(255, 0, 85, 0.2)); border: 2px solid var(--primary); color: var(--primary); font-weight: bold; cursor: pointer; border-radius: 6px; transition: all 0.2s; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; margin-top: 10px;" onmouseover="this.style.boxShadow='0 0 20px rgba(0, 255, 136, 0.4)'" onmouseout="this.style.boxShadow='none'">💾 Save Chaos</button>
			</div>

			<div id="status" class="status">Waiting for source...</div>
		</aside>
	</div>

	<script>
		const view = document.getElementById("view");
		const ctx = view.getContext("2d", { willReadFrequently: true });
		const camera = document.getElementById("camera");
		const photo = document.getElementById("photo");
		const statusEl = document.getElementById("status");

		const sourceCanvas = document.createElement("canvas");
		const sourceCtx = sourceCanvas.getContext("2d", { willReadFrequently: true });
		const workCanvas = document.createElement("canvas");
		const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });
		const mirrorCanvas = document.createElement("canvas");
		const mirrorCtx = mirrorCanvas.getContext("2d");

		const controls = {
			upload: document.getElementById("upload"),
			cameraBtn: document.getElementById("cameraBtn"),
			stopCameraBtn: document.getElementById("stopCameraBtn"),
			micBtn: document.getElementById("micBtn"),
			saveBtn: document.getElementById("saveBtn"),
			rgbSplit: document.getElementById("rgbSplit"),
			datamosh: document.getElementById("datamosh"),
			pixelSort: document.getElementById("pixelSort"),
			audioReactive: document.getElementById("audioReactive"),
			scanlines: document.getElementById("scanlines"),
			vhs: document.getElementById("vhs"),
			mirrorEnabled: document.getElementById("mirrorEnabled"),
			mirrorSectors: document.getElementById("mirrorSectors"),
			freezeEnabled: document.getElementById("freezeEnabled"),
			asciiMode: document.getElementById("asciiMode"),
			chaosLevel: document.getElementById("chaosLevel")
		};

		const state = {
			sourceType: "none",
			stream: null,
			micStream: null,
			analyser: null,
			audioData: null,
			audioLevel: 0,
			prevFrame: null,
			frozenFrame: null,
			freezePoint: { x: 0.5, y: 0.5, r: 0.18 },
			mouse: { x: 0.5, y: 0.5, down: false },
			glitchPulse: 0,
			frame: 0,
			width: view.width,
			height: view.height
		};

		const asciiChars = " .,:;irsXA253hMHGS#9B&@";

		// ==================== INITIALIZATION & UTILITY ====================
		function setStatus(text) {
			statusEl.textContent = text;
		}

		function resizePipeline(w, h) {
			state.width = w;
			state.height = h;
			[view, sourceCanvas, workCanvas, mirrorCanvas].forEach((canvas) => {
				canvas.width = w;
				canvas.height = h;
			});
		}

		function fitToSource(sw, sh) {
			const maxW = 1280;
			const maxH = 720;
			const ratio = Math.min(maxW / sw, maxH / sh, 1);
			resizePipeline(Math.floor(sw * ratio), Math.floor(sh * ratio));
		}

		// ==================== DRAWING & RENDERING ====================
		function drawSource() {
			sourceCtx.clearRect(0, 0, state.width, state.height);
			if (state.sourceType === "camera") {
				sourceCtx.drawImage(camera, 0, 0, state.width, state.height);
				return true;
			}
			if (state.sourceType === "image" && photo.complete) {
				sourceCtx.drawImage(photo, 0, 0, state.width, state.height);
				return true;
			}
			return false;
		}

		function drawScanlines(alpha) {
			if (!controls.scanlines.checked) {
				return;
			}
			ctx.save();
			ctx.globalAlpha = 0.08 + alpha * 0.07;
			for (let y = 0; y < state.height; y += 3) {
				const tone = 24 + Math.floor(50 * Math.abs(Math.sin((y + state.frame) * 0.02)));
				ctx.fillStyle = `rgb(${tone}, ${tone + 20}, ${tone + 40})`;
				ctx.fillRect(0, y, state.width, 1);
			}
			ctx.restore();
		}

		function drawVhsNoise(alpha) {
			if (!controls.vhs.checked) {
				return;
			}
			const intensity = 240 + Math.floor(alpha * 200);
			const count = Math.floor((state.width * state.height) / 1800);
			ctx.save();
			for (let i = 0; i < count; i += 1) {
				const x = Math.random() * state.width;
				const y = Math.random() * state.height;
				const v = Math.random() > 0.5 ? intensity : 20;
				ctx.fillStyle = `rgba(${v}, ${v}, ${v}, ${0.1 + Math.random() * 0.2})`;
				ctx.fillRect(x, y, 1, 1);
			}

			if (Math.random() < 0.22) {
				ctx.fillStyle = `rgba(255,255,255,${0.06 + alpha * 0.1})`;
				ctx.fillRect(0, Math.random() * state.height, state.width, 2 + Math.random() * 4);
			}
			ctx.restore();
		}

		function drawAscii(sourceData) {
			const step = 8;
			ctx.save();
			ctx.fillStyle = "rgba(2, 8, 12, 0.42)";
			ctx.fillRect(0, 0, state.width, state.height);
			ctx.fillStyle = "#9dffd7";
			ctx.font = "9px Consolas, monospace";

			for (let y = 0; y < state.height; y += step) {
				for (let x = 0; x < state.width; x += step) {
					const idx = (y * state.width + x) * 4;
					const r = sourceData[idx];
					const g = sourceData[idx + 1];
					const b = sourceData[idx + 2];
					const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
					const charIdx = Math.min(asciiChars.length - 1, Math.floor(lum * asciiChars.length));
					ctx.fillText(asciiChars[charIdx], x, y);
				}
			}
			ctx.restore();
		}

		function drawMirror(source) {
			const sectors = Number(controls.mirrorSectors.value);
			mirrorCtx.clearRect(0, 0, state.width, state.height);
			mirrorCtx.save();
			mirrorCtx.translate(state.width / 2, state.height / 2);

			const angle = (Math.PI * 2) / sectors;
			const radius = Math.hypot(state.width, state.height);
			for (let i = 0; i < sectors; i += 1) {
				mirrorCtx.save();
				mirrorCtx.rotate(i * angle);
				if (i % 2 === 1) {
					mirrorCtx.scale(-1, 1);
				}
				mirrorCtx.beginPath();
				mirrorCtx.moveTo(0, 0);
				mirrorCtx.arc(0, 0, radius, -angle / 2, angle / 2);
				mirrorCtx.closePath();
				mirrorCtx.clip();
				mirrorCtx.drawImage(source, -state.width / 2, -state.height / 2, state.width, state.height);
				mirrorCtx.restore();
			}
			mirrorCtx.restore();
			ctx.drawImage(mirrorCanvas, 0, 0);
		}

		// ==================== GLITCH & EFFECTS ====================
		function applyRgbSplit(data, amount) {
			const out = new Uint8ClampedArray(data.data);
			const w = data.width;
			const h = data.height;
			const dx = Math.floor((state.mouse.x - 0.5) * 14 * amount);
			const dy = Math.floor((state.mouse.y - 0.5) * 14 * amount);

			const idx = (x, y) => ((y * w + x) * 4);

			for (let y = 0; y < h; y += 1) {
				for (let x = 0; x < w; x += 1) {
					const base = idx(x, y);
					const rx = Math.min(w - 1, Math.max(0, x + dx));
					const gy = Math.min(h - 1, Math.max(0, y - dy));
					const bx = Math.min(w - 1, Math.max(0, x - dx));

					out[base] = data.data[idx(rx, y)];
					out[base + 1] = data.data[idx(x, gy) + 1];
					out[base + 2] = data.data[idx(bx, y) + 2];
				}
			}
			data.data.set(out);
		}

		function applyDatamosh(data, amount) {
			if (!state.prevFrame) {
				state.prevFrame = new Uint8ClampedArray(data.data);
				return;
			}
			const shiftX = Math.floor((Math.sin(state.frame * 0.06) + state.glitchPulse) * 3 * amount);
			const shiftY = Math.floor((Math.cos(state.frame * 0.05) + state.glitchPulse) * 2 * amount);
			const w = data.width;
			const h = data.height;
			const prev = state.prevFrame;
			const mixed = new Uint8ClampedArray(data.data.length);

			for (let y = 0; y < h; y += 1) {
				for (let x = 0; x < w; x += 1) {
					const dst = (y * w + x) * 4;
					const sx = Math.min(w - 1, Math.max(0, x + shiftX));
					const sy = Math.min(h - 1, Math.max(0, y + shiftY));
					const src = (sy * w + sx) * 4;
					const k = 0.36 + Math.min(0.35, amount * 0.16);
					mixed[dst] = data.data[dst] * (1 - k) + prev[src] * k;
					mixed[dst + 1] = data.data[dst + 1] * (1 - k) + prev[src + 1] * k;
					mixed[dst + 2] = data.data[dst + 2] * (1 - k) + prev[src + 2] * k;
					mixed[dst + 3] = 255;
				}
			}
			data.data.set(mixed);
			state.prevFrame = new Uint8ClampedArray(mixed);
		}

		function sortPixelsRow(row, offset, width) {
			row.sort((a, b) => a.lum - b.lum);
			for (let i = 0; i < row.length; i += 1) {
				const p = row[i];
				const idx = offset + i * 4;
				width[idx] = p.r;
				width[idx + 1] = p.g;
				width[idx + 2] = p.b;
			}
		}

		function applyPixelSort(data, amount) {
			const w = data.width;
			const h = data.height;
			const src = data.data;
			const regionW = Math.floor(w * (0.2 + 0.22 * Math.abs(Math.sin(state.frame * 0.015))));
			const regionH = Math.floor(h * (0.2 + 0.2 * Math.abs(Math.cos(state.frame * 0.017))));
			const startX = Math.floor((w - regionW) * ((Math.sin(state.frame * 0.01) + 1) * 0.5));
			const startY = Math.floor((h - regionH) * ((Math.cos(state.frame * 0.013) + 1) * 0.5));
			const stride = Math.max(1, Math.floor(3 - amount));

			for (let y = startY; y < startY + regionH; y += stride) {
				const row = [];
				for (let x = startX; x < startX + regionW; x += 1) {
					const idx = (y * w + x) * 4;
					const r = src[idx];
					const g = src[idx + 1];
					const b = src[idx + 2];
					row.push({ r, g, b, lum: 0.2126 * r + 0.7152 * g + 0.0722 * b });
				}
				sortPixelsRow(row, (y * w + startX) * 4, src);
			}
		}

		function applyAudioDistortion(data, amount) {
			const strength = (state.audioLevel * 24 + state.glitchPulse * 10) * amount;
			if (strength < 1) {
				return;
			}

			const w = data.width;
			const h = data.height;
			const src = new Uint8ClampedArray(data.data);

			for (let y = 0; y < h; y += 1) {
				const wave = Math.floor(Math.sin(y * 0.04 + state.frame * 0.12) * strength);
				for (let x = 0; x < w; x += 1) {
					const nx = Math.max(0, Math.min(w - 1, x + wave));
					const dst = (y * w + x) * 4;
					const from = (y * w + nx) * 4;
					data.data[dst] = src[from];
					data.data[dst + 1] = src[from + 1];
					data.data[dst + 2] = src[from + 2];
				}
			}
		}

		function applyFreeze(data) {
			if (!controls.freezeEnabled.checked) {
				return;
			}
			if (!state.frozenFrame) {
				state.frozenFrame = new Uint8ClampedArray(data.data);
			}
			const w = data.width;
			const h = data.height;
			const cx = Math.floor(state.freezePoint.x * w);
			const cy = Math.floor(state.freezePoint.y * h);
			const r = Math.floor(state.freezePoint.r * Math.min(w, h));
			const frozen = state.frozenFrame;

			for (let y = Math.max(0, cy - r); y < Math.min(h, cy + r); y += 1) {
				for (let x = Math.max(0, cx - r); x < Math.min(w, cx + r); x += 1) {
					const dx = x - cx;
					const dy = y - cy;
					if (dx * dx + dy * dy <= r * r) {
						const idx = (y * w + x) * 4;
						data.data[idx] = frozen[idx];
						data.data[idx + 1] = frozen[idx + 1];
						data.data[idx + 2] = frozen[idx + 2];
					}
				}
			}
		}

		// ==================== MEDIA CONTROL ====================
		async function startCamera() {
			stopCamera();
			try {
				const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
				state.stream = stream;
				camera.srcObject = stream;
				await camera.play();
				fitToSource(camera.videoWidth || 960, camera.videoHeight || 540);
				state.sourceType = "camera";
				setStatus("Камера активна. Двигайте мышью для RGB cмещения.");
			} catch (error) {
				setStatus("Камера недоступна: " + error.message);
			}
		}

		function stopCamera() {
			if (state.stream) {
				state.stream.getTracks().forEach((t) => t.stop());
				state.stream = null;
			}
			camera.srcObject = null;
			if (state.sourceType === "camera") {
				state.sourceType = "none";
			}
		}

		async function startMic() {
			try {
				if (state.micStream) {
					return;
				}
				const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
				const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				const src = audioCtx.createMediaStreamSource(stream);
				const analyser = audioCtx.createAnalyser();
				analyser.fftSize = 512;
				src.connect(analyser);
				state.micStream = stream;
				state.analyser = analyser;
				state.audioData = new Uint8Array(analyser.frequencyBinCount);
				setStatus("Микрофон подключен. Громкость усиливает распад.");
			} catch (error) {
				setStatus("Микрофон недоступен: " + error.message);
			}
		}

		function updateAudioLevel() {
			if (!state.analyser || !state.audioData) {
				state.audioLevel = 0;
				return;
			}
			state.analyser.getByteFrequencyData(state.audioData);
			let sum = 0;
			for (let i = 0; i < state.audioData.length; i += 1) {
				sum += state.audioData[i];
			}
			const avg = sum / state.audioData.length;
			state.audioLevel = avg / 255;
		}

		// ==================== MAIN PROCESSING ====================
		function processFrame() {
			state.frame += 1;
			updateAudioLevel();

			const hasSource = drawSource();
			if (!hasSource) {
				requestAnimationFrame(processFrame);
				return;
			}

			workCtx.drawImage(sourceCanvas, 0, 0);
			let data = workCtx.getImageData(0, 0, state.width, state.height);
			const chaos = Number(controls.chaosLevel.value);

			applyFreeze(data);

			if (controls.rgbSplit.checked) {
				applyRgbSplit(data, chaos);
			}
			if (controls.datamosh.checked) {
				applyDatamosh(data, chaos);
			}
			if (controls.pixelSort.checked && state.frame % 2 === 0) {
				applyPixelSort(data, chaos);
			}
			if (controls.audioReactive.checked) {
				applyAudioDistortion(data, chaos);
			}

			workCtx.putImageData(data, 0, 0);

			ctx.clearRect(0, 0, state.width, state.height);
			if (controls.mirrorEnabled.checked) {
				drawMirror(workCanvas);
			} else {
				ctx.drawImage(workCanvas, 0, 0);
			}

			drawScanlines(state.audioLevel);
			drawVhsNoise(state.audioLevel);

			if (controls.asciiMode.checked) {
				drawAscii(data.data);
			}

			state.glitchPulse *= 0.94;
			requestAnimationFrame(processFrame);
		}

		function applyChaosArtifactOnSave() {
			const temp = document.createElement("canvas");
			temp.width = state.width;
			temp.height = state.height;
			const tctx = temp.getContext("2d", { willReadFrequently: true });
			tctx.drawImage(view, 0, 0);

			const type = Math.floor(Math.random() * 4);
			if (type === 0) {
				tctx.globalCompositeOperation = "difference";
				tctx.fillStyle = "rgba(255, 80, 120, 0.2)";
				tctx.fillRect(0, 0, temp.width, temp.height);
			} else if (type === 1) {
				for (let i = 0; i < 9; i += 1) {
					const y = Math.random() * temp.height;
					const h = 4 + Math.random() * 24;
					const sx = Math.random() * 40 - 20;
					tctx.drawImage(temp, 0, y, temp.width, h, sx, y, temp.width, h);
				}
			} else if (type === 2) {
				const imageData = tctx.getImageData(0, 0, temp.width, temp.height);
				for (let i = 0; i < imageData.data.length; i += 4) {
					if (Math.random() < 0.02) {
						imageData.data[i] = 255;
						imageData.data[i + 1] = 255;
						imageData.data[i + 2] = 255;
					}
				}
				tctx.putImageData(imageData, 0, 0);
			} else {
				tctx.globalCompositeOperation = "screen";
				tctx.fillStyle = "rgba(0, 194, 255, 0.18)";
				tctx.beginPath();
				const x = Math.random() * temp.width;
				const y = Math.random() * temp.height;
				tctx.arc(x, y, 80 + Math.random() * 130, 0, Math.PI * 2);
				tctx.fill();
			}

			const link = document.createElement("a");
			link.href = temp.toDataURL("image/png");
			link.download = `digital-nightmare-${Date.now()}.png`;
			link.click();
		}

		// ==================== EVENT LISTENERS ====================
		controls.upload.addEventListener("change", (event) => {
			const file = event.target.files && event.target.files[0];
			if (!file) {
				return;
			}
			stopCamera();
			const reader = new FileReader();
			reader.onload = () => {
				photo.onload = () => {
					fitToSource(photo.naturalWidth || 960, photo.naturalHeight || 540);
					state.sourceType = "image";
					state.frozenFrame = null;
					state.prevFrame = null;
					setStatus("Фото загружено. Кликните по холсту, чтобы сдвинуть зону freeze.");
				};
				photo.src = reader.result;
			};
			reader.readAsDataURL(file);
		});

		controls.cameraBtn.addEventListener("click", startCamera);
		controls.stopCameraBtn.addEventListener("click", () => {
			stopCamera();
			setStatus("Камера остановлена.");
		});
		controls.micBtn.addEventListener("click", startMic);
		controls.saveBtn.addEventListener("click", applyChaosArtifactOnSave);

		view.addEventListener("mousemove", (event) => {
			const rect = view.getBoundingClientRect();
			state.mouse.x = (event.clientX - rect.left) / rect.width;
			state.mouse.y = (event.clientY - rect.top) / rect.height;
		});

		view.addEventListener("click", (event) => {
			const rect = view.getBoundingClientRect();
			state.mouse.x = (event.clientX - rect.left) / rect.width;
			state.mouse.y = (event.clientY - rect.top) / rect.height;
			state.glitchPulse = Math.min(3, state.glitchPulse + 1.1);

			if (controls.freezeEnabled.checked) {
				state.freezePoint.x = state.mouse.x;
				state.freezePoint.y = state.mouse.y;
				state.frozenFrame = workCtx.getImageData(0, 0, state.width, state.height).data;
				state.freezePoint.r = 0.12 + Math.random() * 0.2;
				setStatus("Freeze зона обновлена щелчком.");
			}
		});

		controls.freezeEnabled.addEventListener("change", () => {
			state.frozenFrame = null;
		});

		controls.audioReactive.addEventListener("change", () => {
			if (controls.audioReactive.checked && !state.analyser) {
				setStatus("Для Audio Reactive включите микрофон.");
			}
		});

		// ==================== VISUAL EFFECT TOGGLES ====================
		// Add .active class to effect toggles for visual feedback
		const effectToggles = [
			{ checkbox: 'rgbSplit', toggle: 'rgbSplitToggle' },
			{ checkbox: 'datamosh', toggle: 'datamoshToggle' },
			{ checkbox: 'pixelSort', toggle: 'pixelSortToggle' },
			{ checkbox: 'audioReactive', toggle: 'audioReactiveToggle' },
			{ checkbox: 'scanlines', toggle: 'scanlinesToggle' },
			{ checkbox: 'vhs', toggle: 'vhsToggle' },
			{ checkbox: 'mirrorEnabled', toggle: 'mirrorToggle' },
			{ checkbox: 'freezeEnabled', toggle: 'freezeToggle' },
			{ checkbox: 'asciiMode', toggle: 'asciiToggle' }
		];

		effectToggles.forEach(({ checkbox, toggle }) => {
			const checkboxEl = document.getElementById(checkbox);
			const toggleEl = document.getElementById(toggle);
			if (checkboxEl && toggleEl) {
				// Set initial state
				if (checkboxEl.checked) {
					toggleEl.classList.add('active');
				}
				// Add change listener
				checkboxEl.addEventListener('change', () => {
					if (checkboxEl.checked) {
						toggleEl.classList.add('active');
					} else {
						toggleEl.classList.remove('active');
					}
				});
			}
		});

		// Update chaos level value display
		const chaosLevelInput = document.getElementById('chaosLevel');
		const chaosValueDisplay = document.getElementById('chaosValue');
		if (chaosLevelInput && chaosValueDisplay) {
			chaosLevelInput.addEventListener('input', () => {
				chaosValueDisplay.textContent = parseFloat(chaosLevelInput.value).toFixed(1);
			});
		}

		window.addEventListener("beforeunload", () => {
			stopCamera();
			if (state.micStream) {
				state.micStream.getTracks().forEach((t) => t.stop());
			}
		});

		processFrame();
	</script>
</body>
