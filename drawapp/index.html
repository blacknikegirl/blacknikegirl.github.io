<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Application Title -->
        <h1>🎨 Drawing Application</h1>

        <!-- Toolbar Section -->
        <div class="toolbar">
            <!-- Color Picker Tool -->
            <div class="tool-group">
                <label for="colorPicker">Color:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <!-- Brush Size Tool -->
            <div class="tool-group">
                <label for="brushSize">Size:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5">
                <span id="brushSizeValue">5px</span>
            </div>

            <!-- Line Cap Style -->
            <div class="tool-group">
                <input type="checkbox" id="lineCap" checked>
                <label for="lineCap">Smooth Edges</label>
            </div>

            <!-- Brush Button -->
            <button id="brushBtn" class="active">🖌️ Brush</button>

            <!-- Eraser Button -->
            <button id="eraserBtn">🧹 Eraser</button>

            <!-- Clear Canvas Button -->
            <button id="clearBtn">Clear Canvas</button>

            <!-- Save Drawing Button -->
            <button id="saveBtn">Save Drawing</button>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container">
            <canvas id="drawingCanvas" width="1200" height="800"></canvas>
        </div>
    </div>

    <!-- Script Link -->
    <script src="script.js"></script>
</body>
</html>
